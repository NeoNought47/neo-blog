<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 三文鱼握寿司。小尺寸靠"上橙下白"的双色轮廓辨识：
       不放海苔带（竖直深色带会把图形劈开读成蘑菇），
       图形撑满约 75% 画布，饭团给足厚度；
       底色用深海苔棕而不是奶油色 —— 白饭团压在奶油底上对比度太低，
       16px 下会整个消失，只剩一坨橙色。 -->
  <rect width="64" height="64" rx="14" fill="#3b2a21"/>

  <g transform="rotate(-5 32 33)">
    <!-- 饭团 -->
    <rect x="9" y="31" width="46" height="25" rx="12" fill="#fffdf6"
          stroke="none"/>

    <!-- 鱼片：比饭团宽，两侧垂下来盖住饭团上缘 -->
    <path d="M5 30.5C5 18.6 14.6 9.5 32 9.5S59 18.6 59 30.5c0 4.2-2.9 6.8-7.4 6.8H12.4C7.9 37.3 5 34.7 5 30.5Z"
          fill="#ee7f52"/>
    <!-- 鱼肉纹路 -->
    <path d="M13.5 28c5.2-6 11.6-9.2 18-9.7" stroke="#ffc9ab" stroke-width="3.4"
          stroke-linecap="round" fill="none"/>
    <path d="M36.5 18.6c6 1 11.2 4.2 15.3 8.8" stroke="#ffc9ab" stroke-width="3.4"
          stroke-linecap="round" fill="none"/>
  </g>
</svg>
